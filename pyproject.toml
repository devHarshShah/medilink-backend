[project]
name = "medilink-backend"
version = "1.0.0"
description = "MediLink Backend API - A comprehensive healthcare management system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.19",
    "qrcode[pil]>=8.0",
    "redis>=5.2.0",
    "boto3>=1.35.0",
    "anthropic>=0.40.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI's Depends() in defaults is the documented idiom
    "UP042",  # `str, Enum` is deliberate: StrEnum changes str() output, which
              # these enums rely on for stable SQLAlchemy and JSON wire values
]
